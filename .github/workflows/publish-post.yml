name: Publish Blog Post

# Publishes every JSON file in _pending_posts/ to the live blog:
#   POST /api/publish → insert into Supabase → revalidate + IndexNow
# and then deletes the files it published, so the folder always shows what is
# still waiting. A file that fails stays put and is retried on the next push.
#
# The publish key comes ONLY from the PUBLISH_SECRET repository secret, which
# must equal REVALIDATION_SECRET on Vercel (production). There is deliberately
# no fallback: this repo is public, and the literal fallback it used to carry
# was the live key for four months — readable by anyone and printed unmasked
# in every run log (CON-323). If the secret is missing the run fails before
# posting anything, and the pending files stay for the next run.

on:
  push:
    paths:
      - '_pending_posts/*.json'
  workflow_dispatch:

permissions:
  # Needed by the cleanup step to push the "remove published files" commit.
  # Without it the publish succeeds but the JSON files pile up — exactly what
  # happened in June 2026: 12 published posts left behind as pending.
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # First, before the checkout and the 180s wait: a missing key is a
      # configuration error, so say so at once instead of failing on every
      # POST with a 401 that looks like a key mismatch.
      - name: Check the publish key is configured
        env:
          PUBLISH_SECRET: ${{ secrets.PUBLISH_SECRET }}
        run: |
          if [ -z "$PUBLISH_SECRET" ]; then
            echo "::error::PUBLISH_SECRET is not set. Add it under Settings → Secrets and variables → Actions with the same value as REVALIDATION_SECRET on Vercel (production). Nothing was published; the pending files stay for the next run."
            exit 1
          fi
          echo "Publish key is configured."

      - uses: actions/checkout@v4
        with:
          # Two commits so we can tell a content-only push from one that also
          # changed code.
          fetch-depth: 2

      - name: Wait for the deploy when this push also changed code
        run: |
          # Real incident, 2026-08-19: a push carried both the new /api/publish
          # and an article. The workflow POSTed 13s later, Vercel was still
          # building, and the OLD handler answered — silently dropping the
          # article's `answer` field (the quotable «En corto» block, which is
          # the whole point of the post for answer engines). A content-only push
          # cannot race anything, so only wait when code moved too.
          changed=$(git diff --name-only HEAD~1 HEAD -- . ':(exclude)_pending_posts/*' 2>/dev/null || true)
          if [ -n "$changed" ]; then
            echo "This push also changed code:"
            echo "$changed" | head -20
            echo "Waiting 180s so the NEW deploy is the one that publishes."
            sleep 180
          else
            echo "Content-only push — publishing right away."
          fi

      - name: Find and publish new posts
        env:
          PUBLISH_URL: https://www.conagentes.com/api/publish
          PUBLISH_SECRET: ${{ secrets.PUBLISH_SECRET }}
        run: |
          published=0
          duplicates=0
          failed=0

          shopt -s nullglob
          for file in _pending_posts/*.json; do
            echo "📝 Publishing: $file"

            response=$(curl -s -L -w "\n%{http_code}" -X POST "$PUBLISH_URL" \
              -H "Authorization: Bearer $PUBLISH_SECRET" \
              -H "Content-Type: application/json" \
              -d @"$file")

            http_code=$(echo "$response" | tail -1)
            body=$(echo "$response" | sed '$d')

            echo "Response: $body"
            echo "HTTP Status: $http_code"

            if [ "$http_code" = "200" ]; then
              echo "✅ Published"
              git rm --quiet "$file"
              published=$((published + 1))
            elif [ "$http_code" = "409" ] || echo "$body" | grep -q "duplicate"; then
              echo "⏭️ Already published (duplicate slug) — dropping the file"
              git rm --quiet "$file"
              duplicates=$((duplicates + 1))
            else
              echo "⚠️ Failed — leaving the file for the next run"
              failed=$((failed + 1))
            fi
          done

          echo "Summary: $published published, $duplicates already published, $failed failed"
          echo "failed=$failed" >> "$GITHUB_ENV"

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "Nothing to clean up."
          else
            git commit -m "chore: cleanup published blog post files"
            git push
          fi

      - name: Fail the run if any post could not be published
        if: env.failed != '0'
        run: |
          echo "::error::${{ env.failed }} post(s) failed to publish — see the log above."
          exit 1
